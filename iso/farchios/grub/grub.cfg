insmod all_video
set default="0"
set timeout="5"
set timeout_style="menu"

menuentry "FarchiOs (x86_64, BIOS)" --class farchios --class gnu-linux --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_curl_url=1 cow_spacesize=8G quiet rw
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "FarchiOs (failsafe / nomodeset)" --class farchios --class gnu-linux --class os {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_curl_url=1 cow_spacesize=8G nomodeset rw
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}
