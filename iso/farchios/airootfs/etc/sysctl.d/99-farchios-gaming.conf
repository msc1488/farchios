# ============================================================
#  FarchiOs — тюнинг под игры
#  Не «магические цифры», а обоснованные компромиссы.
# ============================================================

# --- Отзывчивость десктопа под нагрузкой ---
# swappiness низкий: игра не должна уходить в swap при живой RAM.
vm.swappiness = 10
# Держим грязные страницы дольше → меньше «рывков» при записи шейдер-кэша.
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# --- Память / оверкоммит ---
# 1 = эвристика ядра, стабильнее чем 0 для Wine/Proton-игр.
vm.overcommit_memory = 1
vm.max_map_count = 2147483642
vm.min_free_kbytes = 65536

# --- Сеть (для онлайна) ---
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1

# --- Файлы ---
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# --- Отладка не нужна в проде ---
kernel.nmi_watchdog = 0

# --- Планировщик ввода/вывода: для NVMe лучше none (см. udev-правило) ---
# Меняется udev-правилом 60-farchios-iosched.rules, не здесь.
