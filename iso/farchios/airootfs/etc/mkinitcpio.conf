# ============================================================
#  mkinitcpio.conf для live-образа FarchiOs
#  Хуки archiso* обязательны: без них initramfs не найдёт squashfs.
#  Файл действует ТОЛЬКО в ISO, установленная система берёт свой.
# ============================================================

MODULES=()

BINARIES=()

FILES=()

HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard keymap consolefont)

# zstd вместо xz: распаковка заметно быстрее, размер чуть больше.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 --long=27)
