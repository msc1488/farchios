DEFAULT farchios
PROMPT 0
TIMEOUT 50

LABEL farchios
MENU LABEL FarchiOs (x86_64, BIOS)
TEXT HELP
Загрузка FarchiOs в live-режиме.
Установка: запусти "farchios install" в терминале.
ENDTEXT
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/intel-ucode.img
INITRD /arch/boot/amd-ucode.img
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archiso_curl_url=1 cow_spacesize=8G quiet rw

LABEL farchios-failsafe
MENU LABEL FarchiOs (failsafe / nomodeset)
TEXT HELP
Загрузка без KMS-драйверов. Используй, если на штатной загрузке чёрный экран.
ENDTEXT
LINUX /arch/boot/x86_64/vmlinuz-linux
INITRD /arch/boot/intel-ucode.img
INITRD /arch/boot/amd-ucode.img
INITRD /arch/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=arch archiso_curl_url=1 cow_spacesize=8G nomodeset rw
