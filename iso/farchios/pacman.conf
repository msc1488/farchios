#
# pacman.conf — используется ТОЛЬКО на этапе сборки ISO (mkarchiso).
# Это не конфиг устанавливаемой системы.
#

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
Color
ILoveCandy
ParallelDownloads = 10
DisableDownloadTimeout

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib обязателен: Steam, Wine, 32-битные библиотеки игр.
[multilib]
Include = /etc/pacman.d/mirrorlist

#
# --- ОПЦИОНАЛЬНО: репозитории CachyOS (BORE-ядро, оптимизированные пакеты) ---
# Раскомментируй блок ниже, если хочешь собирать FarchiOs на linux-cachyos.
# ВАЖНО: без этого блока профиль собирается на штатном `linux` и работает всегда.
#
# [cachyos]
# SigLevel = Never
# Server = https://mirror.cachyos.org/repo/$arch/$repo
#
# [cachyos-extra]
# SigLevel = Never
# Server = https://mirror.cachyos.org/repo/$arch/$repo
