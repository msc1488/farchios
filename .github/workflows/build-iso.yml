name: Build ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # На раннере ~14 ГБ свободного места, сборке нужно ~18 ГБ.
      - name: Освободить диск
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
                      /usr/share/swift /usr/local/.ghcup /opt/az
          sudo apt-get clean
          df -h /

      - name: Проверка синтаксиса
        run: |
          chmod +x build.sh docker/build-in-container.sh
          bash -n build.sh
          bash -n iso/farchios/profiledef.sh
          bash -n iso/farchios/airootfs/root/customize_airootfs.sh
          bash -n iso/farchios/airootfs/usr/local/bin/farchios
          bash -n iso/farchios/airootfs/usr/local/bin/farchios-gpu-setup
          bash -n iso/farchios/airootfs/usr/local/bin/farchios-firstboot
          bash -n iso/farchios/airootfs/usr/local/bin/farchios-postinstall
          echo "синтаксис в порядке"

      - name: Сборка Docker-образа
        run: docker build -t farchios-builder ./docker

      - name: Сборка ISO
        run: docker run --rm --privileged -v "$PWD:/build" farchios-builder --quick

      - name: Вернуть права и разбить ISO на части
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" out work || true
          ISO=$(ls out/*.iso | head -1)
          echo "ISO: $ISO ($(du -h "$ISO" | cut -f1))"
          sha256sum "$ISO" | sed "s|out/||" > out/SHA256SUMS
          cd out
          # 1500 MiB < лимит GitHub на файл релиза (2 GiB)
          split -b 1500M "$(basename "$ISO")" "$(basename "$ISO" .iso).part-"
          rm -f "$ISO"
          ls -lh

      - name: Публикация релиза с ISO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: FarchiOs ISO build ${{ github.run_number }}
          body: |
            Автоматическая сборка FarchiOs.

            **Как собрать ISO обратно:**
            ```
            cat farchios-*.iso.part-* > farchios.iso
            sha256sum -c SHA256SUMS
            ```
          files: |
            out/*.part-*
            out/SHA256SUMS
          fail_on_unmatched_files: true
